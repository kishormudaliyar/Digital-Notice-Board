<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#003D82">
    <meta name="description" content="Digital Notice Board - Centralized College Communication System">
    
    <!-- PWA & Favicon -->
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon-192.svg">
    <link rel="apple-touch-icon" href="icon-192.svg">

    <title>Digital Notice Board</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app">
        <!-- LOGIN SCREEN -->
        <div id="loginScreen" class="screen active">
            <div class="login-screen">
                <div class="login-box">
                    <div class="login-title">📢 Notice Board</div>
                    <input type="text" id="usernameInput" class="login-input" placeholder="Username" value="student" autocomplete="username">
                    <input type="password" id="passwordInput" class="login-input" placeholder="Password (any for demo)" autocomplete="current-password">
                    <button class="login-btn" onclick="login()">Login</button>
                    <div class="login-info">
                        <strong>Demo Credentials:</strong><br>
                        Student: username <code>student</code><br>
                        Admin: username <code>admin</code> (allows posting & deleting)
                    </div>
                </div>
            </div>
        </div>

        <!-- HOME SCREEN -->
        <div id="homeScreen" class="screen">
            <header class="header">
                <h1>Notices</h1>
                <div class="header-icons">
                    <button id="installBtn" style="display: none;" aria-label="Install App" title="Install App as PWA" onclick="promptInstallApp()">📥</button>
                    <button aria-label="Settings" title="Settings" onclick="openSettings()">⚙️</button>
                    <button aria-label="Logout" title="Logout" onclick="logout()">👤</button>
                </div>
            </header>
            <div class="search-container">
                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" id="searchInput" placeholder="Search notices by title, content, or priority..." onkeyup="filterNotices()">
                </div>
            </div>
            <div class="notice-list" id="noticeList"></div>
            <button class="fab" id="fab" aria-label="Add Notice" onclick="openAdmin()">+</button>
        </div>

        <!-- DETAIL SCREEN -->
        <div id="detailScreen" class="screen">
            <header class="header">
                <h1>Notice Details</h1>
                <button aria-label="Close" onclick="goHome()">✕</button>
            </header>
            <div class="detail-screen">
                <div id="noticeDetail"></div>
            </div>
        </div>

        <!-- ADMIN SCREEN -->
        <div id="adminScreen" class="screen">
            <header class="header">
                <h1>Post Notice</h1>
                <button aria-label="Close" onclick="goHome()">✕</button>
            </header>
            <div class="admin-screen">
                <div class="form-group">
                    <label for="noticeTitle">Title *</label>
                    <input type="text" id="noticeTitle" placeholder="e.g. Campus Placement Drive" required>
                </div>
                <div class="form-group">
                    <label for="noticeContent">Content *</label>
                    <textarea id="noticeContent" placeholder="Enter notice details..." required></textarea>
                </div>
                <div class="form-group">
                    <label for="noticeDeadline">Deadline (Optional)</label>
                    <input type="date" id="noticeDeadline">
                </div>
                <div class="form-group">
                    <label for="noticePriority">Priority</label>
                    <select id="noticePriority">
                        <option value="low">Low</option>
                        <option value="medium" selected>Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
                <button class="submit-btn" onclick="submitNotice()">Post Notice</button>
            </div>
        </div>

        <!-- SETTINGS SCREEN -->
        <div id="settingsScreen" class="screen">
            <header class="header">
                <h1>Settings</h1>
                <button aria-label="Close" onclick="goHome()">✕</button>
            </header>
            <div class="settings-screen">
                <div class="settings-section">
                    <h3>Notifications</h3>
                    <div class="settings-item">
                        <span>Enable Notifications</span>
                        <div class="toggle" id="notifToggle" onclick="toggleNotifications()">
                            <div class="toggle-switch"></div>
                        </div>
                    </div>
                    <div class="settings-item">
                        <label for="notifTime">Preferred Notification Time</label>
                    </div>
                    <div style="padding: 12px 0;">
                        <select id="notifTime" class="login-input" onchange="updateNotifTime()">
                            <option value="morning">Morning (8:00 AM)</option>
                            <option value="afternoon">Afternoon (1:00 PM)</option>
                            <option value="evening">Evening (6:00 PM)</option>
                        </select>
                    </div>
                </div>
                <div class="settings-section">
                    <h3>About App</h3>
                    <div class="settings-item">
                        <span>Digital Notice Board</span>
                        <span>v1.0.0</span>
                    </div>
                    <div class="settings-item">
                        <span>PWA & Offline Ready</span>
                        <span>Active</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Notification Element -->
    <div id="toast" class="toast"></div>

    <!-- Application Script -->
    <script src="js/app.js"></script>
</body>
</html>
